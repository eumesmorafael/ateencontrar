<style>

canvas{display:block;width:100%;height:100%;background:#3b2350}
.ic{position:absolute;top:1.5%;width:clamp(40px,7%,52px);aspect-ratio:1;border:0;border-radius:50%;background:rgba(255,255,255,.55);font-size:clamp(18px,3.4vw,24px);-webkit-tap-highlight-color:transparent;padding:0;display:none}
#pause{left:1.5%}#som{right:1.5%;display:block}
body[data-est=jogo] #pause{display:block}
#ctl{display:none;position:fixed;inset:0;pointer-events:none;z-index:3;--s:clamp(64px,18vmin,96px)}

.b{pointer-events:auto;position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:var(--s);height:var(--s);border:0;border-radius:50%;background:rgba(255,143,177,.6);color:#fff;font-size:calc(var(--s)*.4);-webkit-tap-highlight-color:transparent;touch-action:none;padding:0}

.bts{display:grid;gap:9px}
.mb{font:inherit;font-size:18px;font-weight:600;border:0;border-radius:14px;padding:12px;background:#fff;color:#8a2a5b;box-shadow:0 2px 0 #e9a9c4;cursor:pointer;touch-action:manipulation}
.mb.pri{background:#ff5c8f;color:#fff;box-shadow:0 2px 0 #c93a6b}.mb.peq{font-size:14px;padding:8px}.mb[hidden]{display:none}.mb:focus-visible{outline:3px solid #3b2350}
@media (orientation:landscape) and (max-height:480px){.card{padding:12px 16px;width:min(520px,100%)}.card h1{font-size:26px}.card p{margin:2px 0 8px;font-size:13px}.bts{grid-template-columns:1fr 1fr;gap:7px}.mb{font-size:15px;padding:8px}}
</style></head><body data-est="menu">

<script>
// ===== EDITE AQUI =====
const NOME = "Amor";
const DATA_ENCONTRO = new Date(2026, 11, 23); // ano, mês (0-11), dia
const TEXTO_FINAL = "Te achei! Agora ninguém separa a gente. Feliz Natal, meu amor! 💕";
// cada coração: C("mensagem") ou {msg:"...", foto:"fotos/1.jpg", audio:"audios/1.mp3"}
const C = msg => ({ msg, foto: "", audio: "" });
// w: largura da fase | p: blocos [x, altura, largura] | pos: corações [x, altura]
const FASES = [
  { nome: "Nossa cidade", topo: "#ffd3e6", base: "#b9a4f5", chao: "#5b3a70", deco: "", w: 1800, grama: "#8a5fa0", luz: "#fff7b0", mov: -1, astro: [540, 70, 30, "#fff3c4"], c1: [.15, "rgba(150,120,200,.55)", "predio", 130, 60], c2: [.4, "rgba(91,58,112,.75)", "predio", 90, 46],
    p: [[300, 50, 90], [420, 100, 90], [640, 60, 120], [900, 70, 80], [1010, 130, 90], [1300, 50, 70], [1400, 100, 80], [1530, 150, 90]],
    pos: [[180, 32], [465, 130], [700, 90], [1055, 160], [1240, 32], [1450, 130], [1575, 180], [1710, 32]],
    cor: [C("Oi, você! Já tô sorrindo aqui."), C("Essa rua ficou sem graça sem você."), C("Seu sorriso é meu lugar favorito."), C("Cada dia a menos é um abraço a mais."), C("Você mora nos meus pensamentos, sem pagar aluguel."), C("Guardei um abraço bem apertado pra você."), C("Andaria qualquer caminho pra chegar em você."), C("Segura aí, amor, eu tô chegando!")],
    mobs: [[560, 1.1, 430, 780], [1180, 1.35, 960, 1390], [1640, 1.5, 1500, 1770]] },
  { nome: "Atravessando o mar", topo: "#c9f0ff", base: "#8fb8ff", chao: "#3f6f9e", deco: "", w: 2100, grama: "#6fa3d4", luz: "#ffffff", mov: -1, astro: [540, 60, 32, "#fffbe0"], c1: [.15, "rgba(120,160,230,.6)", "colina", 70, 200], c2: [.5, "rgba(255,255,255,.28)", "onda", 16, 0],
    p: [[200, 40, 80], [380, 70, 80], [560, 100, 80], [760, 60, 100], [1000, 90, 90], [1130, 140, 90], [1400, 50, 120], [1600, 100, 80], [1740, 150, 80], [1880, 100, 80]],
    pos: [[240, 70], [600, 130], [810, 90], [1175, 170], [1350, 32], [1580, 130], [1780, 180], [1960, 130]],
    cor: [C("Nem o mar segura a minha saudade."), C("Queria tanto estar do seu lado agora."), C("Já ensaiei mil vezes nosso primeiro abraço."), C("Você é a minha parte preferida do dia."), C("Com você eu tenho coragem de sobra."), C("Só mais um pouco e a gente se abraça."), C("A distância não sabe com quem se meteu."), C("Já dá pra sentir seu cheirinho daqui.")],
    mobs: [[470, 1.2, 350, 650], [920, 1.5, 760, 1080], [1460, 1.35, 1330, 1660], [1900, 1.6, 1750, 2040]] },
  { nome: "Floresta", topo: "#d6f5d0", base: "#8fd3a0", chao: "#3d6b4a", deco: "", w: 2400, grama: "#5aa06a", luz: "#d8ff8a", mov: -1, astro: [100, 60, 28, "#fffde0"], c1: [.2, "rgba(70,140,90,.55)", "pinheiro", 120, 70], c2: [.5, "rgba(45,100,65,.8)", "pinheiro", 90, 52],
    p: [[250, 55, 70], [380, 105, 70], [510, 55, 70], [700, 80, 90], [850, 130, 90], [1050, 60, 100], [1300, 90, 70], [1420, 140, 70], [1540, 90, 70], [1800, 70, 100], [1940, 130, 90], [2080, 80, 80]],
    pos: [[415, 135], [895, 160], [1085, 90], [1455, 170], [1690, 32], [1990, 160], [2170, 110], [2320, 32]],
    cor: [C("Gostar de você é a coisa mais fácil do mundo."), C("Você deixa tudo mais leve, sabia?"), C("Queria passear de mãos dadas com você."), C("Meu dia melhora quando você aparece."), C("Até no silêncio eu ouço você."), C("Tô morrendo de saudade, viu?"), C("Todo caminho é bonito quando leva até você."), C("A gente tá quase lá, amor.")],
    mobs: [[620, 1.1, 520, 760], [1120, 1.45, 980, 1260], [1610, 1.25, 1500, 1780], [2050, 1.6, 1900, 2210]] },
  { nome: "A Distância", boss: 1, topo: "#3b2352", base: "#9a5fae", chao: "#2e1a45", deco: "", w: 640, grama: "#7a4a9a", luz: "#ffd3e6", mov: -1,
    astro: [520, 70, 34, "#ffe9a8"], c1: [.2, "#5a3a78", "colina", 90, 220], c2: [.5, "#3d2757", "pinheiro", 110, 120],
    p: [[110, 70, 100], [430, 70, 100]], pos: [], cor: [] },
  { nome: "Quase lá", topo: "#ffe6c9", base: "#ffb3c7", chao: "#7a4a6a", deco: "", w: 2600, grama: "#c77aa0", luz: "#ffc0d8", mov: 1, astro: [540, 60, 34, "#fff0c9"], c1: [.2, "rgba(255,150,180,.5)", "colina", 90, 180], c2: [.5, "rgba(160,90,140,.7)", "colina", 55, 110],
    p: [[220, 60, 80], [360, 110, 80], [500, 60, 80], [700, 90, 70], [830, 140, 70], [960, 90, 70], [1200, 70, 110], [1400, 120, 80], [1530, 70, 80], [1700, 110, 80], [1830, 160, 80], [2050, 60, 100], [2200, 110, 90]],
    pos: [[400, 140], [865, 170], [1255, 100], [1530, 32], [1870, 190], [2050, 32], [2245, 140], [2420, 32]],
    cor: [C("Essa distância tá com os dias contados."), C("Tenho tanta coisa pra te contar pessoalmente."), C("Mais um pouquinho e eu te vejo."), C("Nosso Natal vai ser coladinho."), C("Dia 23 tem abraço demorado, já aviso."), C("Consigo até imaginar sua cara quando me vir."), C("Você tá logo ali, dá pra sentir."), C("Última corrida, amor. Vem!")],
    mobs: [[580, 1.3, 450, 730], [1040, 1.55, 900, 1190], [1450, 1.4, 1320, 1610], [1770, 1.7, 1660, 1910], [2150, 1.8, 2010, 2310]] }
];

// mobs voadores extras (morcegos): [x, altura, velocidade, min, max]
FASES[1].voa = [[1250, 120, 1.1, 1130, 1380]];
FASES[2].voa = [[800, 110, 1.2, 700, 950], [1700, 120, 1.3, 1600, 1850]];
FASES[4].voa = [[700, 120, 1.4, 600, 820], [1600, 130, 1.5, 1500, 1750], [2350, 120, 1.5, 2250, 2500]];

const $ = id => document.getElementById(id);
const W = 640, H = 360, CHAO = 280, TAM = 64, DT = 1000 / 60;
const cv = $("c"), ctx = cv.getContext("2d");
if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
let S = 1;
let shk = 0, sx = 0, sy = 0;
const tr = x => ctx.setTransform(S, 0, 0, S, (x + sx) * S, sy * S);
function ajustar() {
  const r = cv.getBoundingClientRect();
  S = Math.min(3, Math.max(1, (r.width / W) * Math.min(window.devicePixelRatio || 1, 2)));
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
}
function criarPersonagem(arquivo, emoji) {
  const personagem = { ok: false, emoji, el: new Image() };
  personagem.el.onload = () => personagem.ok = true;
  personagem.el.src = arquivo;
  return personagem;
}
const EU = criarPersonagem("assets/eu.png", "🧑"), ELA = criarPersonagem("assets/ela.png", "👩");
let fase = 0, WORLD = 640, cam = 0, t = 0, cena = 0, est = "menu", pausado = false, total = 0, aviso = "", avisoT = 0;
let p, elaX = 520, plat = [], cor = [], mobs = [], boss = null, cps = [], ck = { x: 24 };
let msgT = 0, msg = null, fotoEl = null, banner = 0, fx = [], nuvens = [], luzes = [];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function setEst(e) { est = e; document.body.dataset.est = e; }

// ---- progresso e configurações ----
const K_PROG = "ate-te-encontrar-progress-v1", K_SAVE = "ate-te-encontrar-save-v2", K_CFG = "ate-te-encontrar-config-v1";
const ler = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let cfg = Object.assign({ som: true }, ler(K_CFG));
function lerProgresso() {
  let s = ler(K_SAVE);
  if (!s || typeof s !== "object") { let old = 0; try { old = Number(localStorage.getItem(K_PROG)) || 0; } catch (e) {} s = { desbloqueada: old, melhor: { fase: old, coracoes: 0 }, finais: 0 }; }
  s.melhor = Object.assign({ fase: 0, coracoes: 0 }, s.melhor);
  s.desbloqueada = clamp(s.desbloqueada | 0, 0, FASES.length - 1);
  return s;
}
function salvarProgresso(indice) {
  const s = lerProgresso();
  s.desbloqueada = Math.max(s.desbloqueada, indice); s.melhor.fase = Math.max(s.melhor.fase, indice);
  s.melhor.coracoes = Math.max(s.melhor.coracoes, total);
  gravar(K_SAVE, s);
}
function apagarProgresso() { try { localStorage.removeItem(K_SAVE); localStorage.removeItem(K_PROG); } catch (e) {} }

// ---- áudio (arquivos locais em assets/audio; o jogo funciona sem som) ----
let ac = null; const bufs = {};
function iniciarAudio() {
  if (ac) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return; ac = new A();
    ["pulo", "coracao", "dano", "mob", "ataque", "chefe", "vitoria"].forEach(n => fetch(`assets/audio/${n}.wav`)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))
      .then(d => { bufs[n] = d; }).catch(() => {}));
  } catch (e) { ac = null; }
}
function tocar(n, v = .6) {
  if (!cfg.som || !ac || !bufs[n]) return;
  try {
    if (ac.state === "suspended") ac.resume().catch(() => {});
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = bufs[n]; g.gain.value = v; s.connect(g); g.connect(ac.destination); s.start();
  } catch (e) {}
}
const vibrar = padrao => { try { if (navigator.vibrate) navigator.vibrate(padrao); } catch (e) {} };
function atualizarSom() { const s = cfg.som; $("som").textContent = s ? "🔊" : "🔇"; $("mSom").textContent = s ? "🔊 Som: ligado" : "🔇 Som: desligado"; }
function alternarSom() { cfg.som = !cfg.som; gravar(K_CFG, cfg); iniciarAudio(); atualizarSom(); }

// ---- telas ----
function mostrar(id, on) { const el = $(id); el.classList.toggle("vis", on); if (on) { const b = el.querySelector(".mb:not([hidden])"); if (b) b.focus({ preventScroll: true }); } }
function esconderTudo() { ["menu", "pausa", "derrota", "confirma"].forEach(i => mostrar(i, false)); }
function setPausa(on) { pausado = on; if (on) document.body.dataset.pausa = "1"; else delete document.body.dataset.pausa; mostrar("pausa", on); soltarTudo(); }
function irMenu() {
  esconderTudo(); setPausa(false); setEst("menu"); carregar(0); atualizarMenu(); mostrar("menu", true);
}
function atualizarMenu() {
  const s = lerProgresso(), tem = s.desbloqueada > 0 || s.melhor.fase > 0 || s.melhor.coracoes > 0 || s.finais > 0;
  $("sub").textContent = "um jogo para você, " + NOME;
  $("mCont").hidden = !tem; $("mNovo").hidden = !tem; $("mApagar").hidden = !tem;
  $("mCont").textContent = `Continuar · Fase ${s.desbloqueada + 1}`;
  $("rec").textContent = tem ? `Melhor progresso: fase ${s.melhor.fase + 1} de ${FASES.length} · ${s.melhor.coracoes} 💗` : "";
  atualizarSom();
}
function iniciar(i) { iniciarAudio(); esconderTudo(); setPausa(false); total = 0; setEst("jogo"); carregar(i); }
function perguntar(txt, acao) { $("cTxt").textContent = txt; $("cSim").onclick = () => { mostrar("confirma", false); acao(); }; mostrar("confirma", true); }
$("mCont").onclick = () => iniciar(lerProgresso().desbloqueada);
$("mComecar").onclick = () => iniciar(0);
$("mNovo").onclick = () => perguntar("Isso apaga todo o seu progresso e começa um jogo novo.", () => { apagarProgresso(); iniciar(0); });
$("mApagar").onclick = () => perguntar("Isso apaga a fase desbloqueada e o melhor progresso salvos neste aparelho.", () => { apagarProgresso(); irMenu(); });
$("cNao").onclick = () => mostrar("confirma", false) || mostrar("menu", true);
$("mSom").onclick = $("som").onclick = alternarSom;
$("pause").onclick = () => { if (est === "jogo") setPausa(!pausado); };
$("pCont").onclick = () => setPausa(false);
$("pReiniciar").onclick = () => { setPausa(false); carregar(fase); };
$("pMenu").onclick = irMenu;
$("dTentar").onclick = renascer;
$("dReiniciar").onclick = () => { esconderTudo(); setEst("jogo"); carregar(fase); };
$("dMenu").onclick = irMenu;

// ---- entrada: teclado + botões de toque (multitoque) ----
const kb = {}, tc = {}, held = { L: 0, R: 0, J: 0, A: 0 }, prs = { L: 0, R: 0, J: 0, A: 0 }, pt = new Map();
const BTN = { bL: "L", bR: "R", bJ: "J", bA: "A" };
function upd(k) { const on = !!(kb[k] || tc[k]); if (on && !held[k]) prs[k] = 1; held[k] = on ? 1 : 0; }
function sync() {
  const on = new Set(pt.values());
  Object.keys(BTN).forEach(id => { const k = BTN[id]; tc[k] = on.has(k); upd(k); $(id).classList.toggle("on", tc[k]); });
}
function soltarTudo() { pt.clear(); Object.keys(kb).forEach(k => kb[k] = 0); sync(); ["L", "R", "J", "A"].forEach(upd); }
function apontar(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest && el.closest(".b");
  if (b && !b.hidden) pt.set(e.pointerId, BTN[b.id]); else pt.delete(e.pointerId);
  sync();
}
$("ctl").addEventListener("pointerdown", e => { e.preventDefault(); iniciarAudio(); if (e.target.closest(".b")) apontar(e); });
window.addEventListener("pointermove", e => { if (pt.has(e.pointerId)) apontar(e); });
["pointerup", "pointercancel"].forEach(v => window.addEventListener(v, e => { if (pt.delete(e.pointerId)) sync(); }));
["blur", "orientationchange", "resize"].forEach(v => window.addEventListener(v, () => { soltarTudo(); setTimeout(ajustar, 120); ajustar(); }));
document.addEventListener("visibilitychange", () => { soltarTudo(); if (document.hidden && est === "jogo" && !pausado) setPausa(true); });
const KM = { ArrowLeft: "L", a: "L", A: "L", ArrowRight: "R", d: "R", D: "R", ArrowUp: "J", " ": "J", w: "J", W: "J", x: "A", X: "A", z: "A", Z: "A", j: "A", J: "A" };
document.addEventListener("keydown", e => {
  iniciarAudio();
  if (e.key === "Escape" || e.key === "p" || e.key === "P") { if (est === "jogo") setPausa(!pausado); return; }
  if (est === "fim" && cena > 400 && (e.key === "Enter" || e.key === " ")) return irMenu();
  const k = KM[e.key]; if (est !== "jogo" || !k) return;
  e.preventDefault(); kb[k] = 1; upd(k);
});
document.addEventListener("keyup", e => { const k = KM[e.key]; if (k) { kb[k] = 0; upd(k); } });
cv.addEventListener("pointerdown", () => { iniciarAudio(); if (est === "fim" && cena > 400) irMenu(); });
document.oncontextmenu = e => e.preventDefault();

// ---- fases ----
function novoBoss() { return { x: 420, y: CHAO + 4, vx: 1.6, vida: 3, inv: 0, est: "anda", tm: 110, dir: -1 }; }
function carregar(indice) {
  fase = indice;
  const F = FASES[fase];
  WORLD = F.w;
  plat = F.p.map(([x, altura, largura]) => ({ x, y: CHAO - altura, w: largura }));
  cor = F.pos.map(([x, altura], i) => ({ ...F.cor[i], x, y: CHAO - altura, pego: false }));
