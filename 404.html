<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Página não encontrada</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #3b2350;
        color: #ffd3e6;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 20px;
      }
      a {
        color: #fff;
        background: #ff5c8f;
        padding: 12px 22px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Ops, esse caminho não existe 💔</h1>
      <p>Mas o jogo está te esperando.</p>
      <p><a id="a" href="/jogo/">Voltar ao jogo</a></p>
    </div>
    <script>
      document.getElementById("a").href = location.pathname.startsWith("/jogo/")
        ? "/jogo/"
        : "/";
    </script>
  </body>
</html>
